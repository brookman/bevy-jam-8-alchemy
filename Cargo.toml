[package]
name = "bevy-jam-8-alchemy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[features]
dev = [
    "bevy/dynamic_linking",
    "bevy/debug",
    "bevy/file_watcher",
    "bevy/embedded_watcher",
    "dep:bevy-inspector-egui",
    "dep:bevy_egui",
    "dep:egui_dock",
    # Lets the Blender addon fetch the type registry from the running game (BRP on localhost).
    "bevy_skein/presets",
]
tracy = ["bevy/trace_tracy"]

[dependencies]
bevy = { version = "0.20", features = ["pan_orbit_camera", "asset_processor"] }
bevy_ahoy = { git = "https://github.com/brookman/bevy_ahoy.git" }
bevy_fix_cursor_unlock_web = { git = "https://github.com/brookman/bevy_fix_cursor_unlock_web.git" }
bevy_asset_loader = "0.28"
egui_dock = { version = "0.21", optional = true }
bevy_egui = { version = "0.43", default-features = false, features = ["picking"], optional = true }
bevy_enhanced_input = "0.27"
bevy_framepace = { git = "https://github.com/martinfrances107/bevy_framepace.git", rev = "a6e0e7cd57d56b6a4419f7be23f1c6580b2121df" }
bevy-inspector-egui = { version = "0.38", optional = true }
bevy_skein = { version = "0.7", default-features = false }

avian3d = "0.8"
blocking = "1.7"
fastrand = "2.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[patch."https://github.com/brookman/avian_pickup.git"]
# It's impossible to replace an URL with the same one (but a different revision).
# Therefore, we use this hacky approach of replacing the https:// URL with an ssh:// URL.
avian_pickup = { git = "ssh://git@github.com/brookman/avian_pickup", rev = "5cf6304eabfa4cd907741c28362d20527eac658a" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0", features = ["webgpu"] }
fastrand = { version = "2", features = ["js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "thin"

[profile.web]
inherits = "dist"
opt-level = "z"
lto = "fat"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

too_many_arguments = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
